# mouse support: wheel scrolling, click to select panes, drag borders to resize
set -g mouse on

# scrollback lines kept per pane (tmux default is 2000)
set -g history-limit 50000

# new panes/windows open in the current pane's directory (default: session start dir)
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# renumber windows when one closes, so prefix+<n> stays predictable
set -g renumber-windows on

# number windows/panes from 1 to match keyboard order
set -g base-index 1
setw -g pane-base-index 1

# vi keys in copy mode
setw -g mode-keys vi

# true color (outer TERM is xterm-256color in iTerm2, xterm-ghostty in Ghostty)
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB,xterm-ghostty:RGB'

# pass terminal focus events through to vim (autoread, FocusGained)
set -g focus-events on

# prefix+r reloads this config
bind r source-file ~/.tmux.conf \; display "config reloaded"

# status-bar messages linger 2s instead of 750ms
set -g display-time 2000
